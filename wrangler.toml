name = "ai-secretary"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]
pages_build_output_dir = ".vercel/output/static"

# D1 Database
[[d1_databases]]
binding = "DB"
database_name = "ai-secretary-db"
database_id = "be74e636-2bbc-4acd-92dd-ab62e059e708"

# Workers AI (免费模型，用于日程解析和对话生成)
[[ai]]
binding = "AI"

# Environment variables
[vars]
# ⚠️ 部署时请修改以下值
AUTH_PASSPHRASE = "change-me"        # 登录密码
JWT_SECRET = "change-me-to-random"   # 随机生成: openssl rand -hex 32
LLM_PROVIDER = "cf-ai"               # cf-ai(免费) | openai(需Key) | rule-based(离线)
